# Pages CMS (https://pagescms.org) : édition des contenus par la connexion GitHub, sans toucher au code.
# Chaque enregistrement crée un commit ; Cloudflare Pages republie le site en une à deux minutes.
# Les articles et les pages légales ont des champs ; les autres fichiers s'éditent en YAML (structure à garder).
media:
  input: src/assets
  output: /src/assets
content:
  - name: insights
    label: Insights (articles)
    type: collection
    path: src/content/insights
    filename: "{primary}.md"
    view:
      fields: [title, category, publishedAt]
      primary: title
      sort: [publishedAt]
    fields:
      - { name: title, label: Titre, type: string, required: true }
      - { name: seoTitle, label: Titre pour Google, type: string }
      - { name: description, label: Description pour Google, type: text, required: true }
      - { name: category, label: Catégorie, type: select, options: { values: [Stratégie, Acquisition, Création, Business] }, required: true }
      - { name: author, label: Autrice, type: string, default: Amira Dounassre }
      - { name: excerpt, label: Résumé, type: text, required: true }
      - { name: answer, label: Réponse courte (encadré), type: text }
      - { name: publishedAt, label: Publié le, type: date, required: true }
      - { name: updatedAt, label: Mis à jour le, type: date }
      - { name: levier, label: Expertises liées, type: select, list: true, options: { values: [strategie, creation, acquisition, pilotage, sites-web] } }
      - { name: order, label: Ordre, type: number }
      - { name: draft, label: Brouillon, type: boolean, default: false }
      - { name: body, label: Texte, type: rich-text }
  - name: legal
    label: Pages légales
    type: collection
    path: src/content/legal
    view:
      fields: [title, updatedAt]
    fields:
      - { name: title, label: Titre, type: string, required: true }
      - { name: seoTitle, label: Titre pour Google, type: string, required: true }
      - { name: description, label: Description pour Google, type: text, required: true }
      - { name: updatedAt, label: Dernière mise à jour, type: date, required: true }
      - { name: body, label: Texte, type: rich-text }
