# Contenu de /llms.txt (résumé du cabinet pour les moteurs de réponse). Texte brut au format llms.txt.
texte: |
  # Leadvice

  > Leadvice est un cabinet de conseil en stratégie marketing et en acquisition client basé à Casablanca (Maroc), fondé en 2022 par Amira Dounassre et Nada Moujibi. Le cabinet conseille et exécute : stratégie, création publicitaire, campagnes Meta Ads et Google Ads, génération de leads et pilotage de la performance.

  ## Expertises
  - [Stratégie](https://leadvice.org/expertises/strategie/) : audit marketing, positionnement, structuration de l'offre, stratégie d'acquisition, plan d'action.
  - [Création](https://leadvice.org/expertises/creation/) : concepts créatifs, accroches, publicités statiques et vidéo, contenus en français et en arabe.
  - [Acquisition](https://leadvice.org/expertises/acquisition/) : Meta Ads, Google Ads, génération de leads qualifiés, ciblage, media buying.
  - [Pilotage](https://leadvice.org/expertises/pilotage/) : suivi hebdomadaire, reporting, optimisation continue, co-pilotage.
  - [Sites web](https://leadvice.org/expertises/sites-web/) : sites vitrines, pages de destination et parcours de réservation, pensés pour les campagnes.

  ## Méthode
  Diagnostiquer, structurer, exécuter, mesurer, optimiser.

  ## Secteurs
  - [Immobilier](https://leadvice.org/secteurs/immobilier/) : promoteurs et commercialisateurs, de l'annonce à la visite et à la réservation.
  - [Grands comptes et B2B](https://leadvice.org/secteurs/b2b/) : campagnes qui parlent à chaque décideur, suivi jusqu'à l'opportunité signée.
  - [Marques et e-commerce](https://leadvice.org/secteurs/e-commerce/) : campagnes pilotées sur les commandes confirmées et livrées.

  ## Chiffres (au 1er octobre 2026, tous clients confondus, depuis janvier 2022)
  Plus de 80 000 leads générés pour les clients ; plus de 1 400 leads par mois en moyenne ; plus de 42 entreprises accompagnées. Coût moyen par lead : moins de 10 DH (moins de 1 $) sur Meta Ads, de 10 à 20 DH (1 à 2 $) sur Google Ads. Un lead n'est compté que s'il passe le formulaire qui qualifie.

  ## Clients
  Kettani Immobilier, Royal Air Maroc, Attijariwafa bank, ITROAD Group, ZEYA, Beadsbox, Milla, Frag'in.

  ## Insights
  - [Tous les articles](https://leadvice.org/insights/) : acquisition, création, stratégie et pilotage, écrits par Amira Dounassre.

  ## Ressources
  - [Ressources](https://leadvice.org/ressources/) : guides, skills Claude et lettre mensuelle sur l'acquisition client au Maroc.

  ## Ateliers
  - [Pilotez une campagne](https://leadvice.org/ateliers/simulateur-campagne/) : simulateur pédagogique de campagne Meta Ads et Google Ads sur huit semaines (chiffres fictifs).
  - [Construisez une page qui convertit](https://leadvice.org/ateliers/page-qui-convertit/) : atelier en trois niveaux sur la page d'atterrissage.

  ## Contact
  - [Demander un diagnostic](https://leadvice.org/diagnostic/) : échange de 45 minutes, offert, en visio ou par téléphone ; plan d'acquisition écrit remis sous 48 heures.
  - contact@leadvice.org
