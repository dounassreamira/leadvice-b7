benefices:
- titre: Voir où part le budget.
  texte: Campagne par campagne, audience par audience.
- titre: Repérer les fuites.
  texte: Anomalies de coût, audiences qui se chevauchent, créations usées, leads jamais rappelés.
- titre: Savoir par quoi commencer.
  texte: Des priorités claires, dans le bon ordre.
formulaire_titre: Parlons de vos campagnes.
faq:
- q: Quels indicateurs suivez-vous ?
  a:
  - 'Ceux qui mènent à vos ventes : coût par lead, part de leads qualifiés, coût par opportunité, coût d''acquisition client. Les indicateurs de visibilité (impressions, clics) aident à comprendre une campagne. Les décisions se prennent sur les ventes.'
- q: Pouvez-vous reprendre des campagnes gérées par quelqu'un d'autre ?
  a:
  - Oui. Nous commençons par un audit de l'existant pour comprendre ce qui fonctionne et ce qui doit changer, avant de toucher quoi que ce soit.
- q: Quelle différence entre un audit et un diagnostic ?
  a:
  - 'Le diagnostic est un premier échange de 45 minutes, offert, pour identifier ce qui freine votre acquisition. L''audit est une mission complète : nous analysons en profondeur vos campagnes, vos contenus, vos chiffres et votre parcours client, et nous remettons un plan d''action.'
- q: Combien coûte un accompagnement ?
  a: 'Nos honoraires dépendent du périmètre : nombre de canaux, de campagnes et de créations. Nous vous faisons une proposition chiffrée après le diagnostic, une fois vos objectifs connus. Le budget publicitaire est payé directement aux plateformes.'
benefices_titre: Ce que vous y gagnez.
chiffres_titre: Des résultats qui se comptent.
chiffres_note: 'Chiffres au 1er octobre 2026, tous clients confondus, depuis janvier 2022. Un lead n''est compté que s''il passe le formulaire qui qualifie. Le coût par lead varie selon le secteur : il est plus élevé pour un appartement que pour un produit du quotidien.'
logos_titre: Ils nous ont fait confiance.
methode_titre: Notre méthode, en cinq temps.
faq_titre: Vos questions.
