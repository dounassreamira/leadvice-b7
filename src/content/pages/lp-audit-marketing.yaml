seo:
  title: 'Audit marketing : savez-vous ce qui fonctionne vraiment ? | Leadvice'
  description: Nous auditons vos campagnes, vos contenus et vos chiffres pour vous montrer où part votre budget, et comment le remettre au travail. Diagnostic offert de 45 minutes.
  og: lp-audit
enjeu: pilot
h1: Vous dépensez. Savez-vous ce qui fonctionne ?
sous_titre: Nous auditons vos campagnes, vos contenus et vos chiffres pour vous montrer où part votre budget, et comment le remettre au travail.
