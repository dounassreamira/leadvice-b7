seo:
  title: Réalisations et clients | Leadvice
  description: 'Immobilier, banque, transport aérien, services IT, e-commerce : les entreprises qui ont confié leur stratégie et leur acquisition à Leadvice.'
  og: realisations
fil: Réalisations
h1: Plus de 42 entreprises, un même chemin.
reponse: 'Des entreprises de secteurs très différents nous ont confié leur stratégie, leurs créations ou leur acquisition : une compagnie aérienne, une banque, un groupe de services informatiques, un promoteur immobilier, des marques et des boutiques en ligne. Voici une partie d''entre elles.'
