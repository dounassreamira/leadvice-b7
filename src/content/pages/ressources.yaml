seo:
  title: Ressources acquisition client au Maroc | Leadvice
  description: Guides, skills Claude et lettre mensuelle pour mieux recruter vos clients au Maroc. Des méthodes tirées de comptes publicitaires réels, à appliquer vous-même.
  og: accueil
fil: Ressources
h1: Des méthodes pour faire le travail vous-même.
reponse: Ce que nous voyons chaque semaine dans les comptes publicitaires de nos clients, transformé en méthodes que vous pouvez appliquer seul. Écrit par Amira Dounassre, avec des exemples marocains.
types_titre: Trois formats
types:
  - nom: Guides
    texte: Un sujet précis, une méthode pas à pas, des modèles à recopier. En PDF, à garder.
    valeur: guides
  - nom: Skills Claude
    texte: Des instructions prêtes à l'emploi pour faire relire une annonce, une page ou un formulaire par Claude.
    valeur: skills
  - nom: Lettre mensuelle
    texte: Une fois par mois, ce qui marche en acquisition au Maroc, avec les chiffres et sans jargon.
    valeur: lettre
