benefices:
- titre: Des leads qui ont un projet.
  texte: 'Des formulaires qui qualifient avant de compter : objectif, rôle, budget.'
- titre: Un coût par lead maîtrisé.
  texte: Moins de 1 $ sur Meta Ads et 1 à 2 $ sur Google Ads en moyenne chez nos clients.
- titre: Un budget qui va où ça rapporte.
  texte: Les chiffres sont relus chaque semaine et le budget suit les campagnes qui produisent des clients.
formulaire_titre: Parlons de vos leads.
faq:
- q: Quel budget publicitaire faut-il prévoir ?
  a:
  - Il dépend de votre marché, de votre panier moyen et du nombre de clients que vous visez. Nous le calculons avec vous à partir de vos objectifs, pas l'inverse. Le budget publicitaire est payé directement aux plateformes, séparément de nos honoraires.
- q: Comment faites-vous pour obtenir des leads de qualité ?
  a:
  - 'En triant avant de compter : des audiences précises, des messages qui attirent les bonnes personnes et repoussent les autres, et des formulaires qui posent les questions utiles. Nous suivons ensuite ce que deviennent les leads, pas seulement leur nombre.'
- q: Pouvez-vous aussi créer nos pages de destination ?
  a:
  - Oui. Une campagne qui renvoie vers une page pensée pour elle convertit mieux qu'une page d'accueil générale. Nous concevons ces pages, ou un site complet, dans notre offre <a class="tlink" href="/expertises/sites-web/">Sites web</a>.
- q: Combien coûte un accompagnement ?
  a: 'Nos honoraires dépendent du périmètre : nombre de canaux, de campagnes et de créations. Nous vous faisons une proposition chiffrée après le diagnostic, une fois vos objectifs connus. Le budget publicitaire est payé directement aux plateformes.'
benefices_titre: Ce que vous y gagnez.
chiffres_titre: Des résultats qui se comptent.
chiffres_note: 'Chiffres cumulés depuis la création du cabinet. Le coût par lead varie selon le secteur : il est plus élevé pour un bien immobilier à plusieurs millions de dirhams que pour un produit du quotidien.'
