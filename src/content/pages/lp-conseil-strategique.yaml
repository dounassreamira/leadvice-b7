benefices:
- titre: Un diagnostic sans complaisance.
  texte: Ce qui coûte sans rapporter, ce qui marche sans être exploité, ce qui manque.
- titre: Des décisions, pas un rapport.
  texte: Un plan hiérarchisé que vos équipes peuvent exécuter dès le lendemain.
- titre: Un regard d'auditrice et d'ingénieure.
  texte: Une lecture business et chiffrée de vos sujets marketing.
formulaire_titre: Parlons de votre stratégie.
faq:
- q: Quelle différence entre un audit et un diagnostic ?
  a:
  - 'Le diagnostic est un premier échange de 45 minutes, offert, pour identifier ce qui freine votre acquisition. L''audit est une mission complète : nous analysons en profondeur vos campagnes, vos contenus, vos chiffres et votre parcours client, et nous remettons un plan d''action.'
- q: Combien de temps dure une mission de stratégie ?
  a:
  - Cela dépend du périmètre. Un audit avec plan d'action se mène en quelques semaines. Un accompagnement de la direction sur le positionnement ou l'offre peut s'étendre sur plusieurs mois, avec des points réguliers. Nous fixons le calendrier ensemble dès le départ.
- q: Faut-il déjà avoir des campagnes en cours ?
  a:
  - Non. Si vous en avez, nous les analysons. Si vous n'en avez pas, nous partons de votre offre, de vos clients actuels et de votre marché pour construire la stratégie avant le premier lancement, ce qui évite de payer pour apprendre.
- q: Combien coûte un accompagnement ?
  a: 'Nos honoraires dépendent du périmètre : nombre de canaux, de campagnes et de créations. Nous vous faisons une proposition chiffrée après le diagnostic, une fois vos objectifs connus. Le budget publicitaire est payé directement aux plateformes.'
benefices_titre: Ce que vous y gagnez.
chiffres_titre: Des résultats qui se comptent.
chiffres_note: 'Chiffres au 1er octobre 2026, tous clients confondus, depuis janvier 2022. Un lead n''est compté que s''il passe le formulaire qui qualifie. Le coût par lead varie selon le secteur : il est plus élevé pour un appartement que pour un produit du quotidien.'
