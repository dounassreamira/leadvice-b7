# Accueil « Parcours » : le chemin d'un prospect, puis le fil qui relie chaque section.
# Ton narratif sur l'ouverture et les situations, direct et chiffré sur les expertises, la méthode et les chiffres.
seo:
  title: "Leadvice : acquisition client, Meta Ads et Google Ads au Maroc"
  description: "Cabinet d'acquisition client à Casablanca. Nous construisons et pilotons le chemin de vos clients, de l'annonce Meta ou Google jusqu'au rendez-vous. Diagnostic offert."
  og: accueil

ouverture:
  aria: "Le chemin d'un prospect, de l'annonce au rendez-vous"
  passer: Passer l'histoire
  note: 45 minutes, offert. Votre plan écrit sous 48 heures.
  scenes:
    - titre: Votre prochain client vient de voir votre annonce.
      texte: "Il est 22 h, et il cherche exactement ce que vous vendez. Ce qui se passe dans les heures qui suivent décide s'il signera chez vous ou chez un concurrent. Leadvice, cabinet d'acquisition client à Casablanca, construit ce chemin : annonces Meta Ads et Google Ads, page, formulaire et suivi des demandes."
    - titre: Il décide en trois secondes.
      texte: "Si la page ne reprend pas mot pour mot la promesse de l'annonce, il revient en arrière. Le clic est payé et le client repart. La page doit répéter la promesse et ne proposer qu'une chose à faire."
    - titre: Trois questions suffisent.
      texte: "Assez pour savoir si c'est un vrai projet et quand l'appeler. Chaque question en trop fait partir quelqu'un. Chaque question qui manque fait perdre une heure à vos commerciaux."
    - titre: Il reçoit une réponse dans la minute.
      texte: "Personne ne rappelle à 22 h, et ce n'est pas grave. Un message WhatsApp automatique le remercie, reprend sa demande et lui propose un créneau. Le lendemain à 9 h 30, votre commercial l'appelle en sachant déjà ce qu'il cherche."
    - titre: Ce qui a vendu, c'est le chemin entier.
      texte: "L'annonce, la page, le formulaire, la réponse, l'appel et le rendez-vous, sans trou entre deux. Nous construisons ce chemin avec vos équipes, puis nous le pilotons avec vous chaque semaine."
  ecrans:
    marque: Votre marque
    sponsorise: Sponsorisé
    annonce_titre: Votre offre, dite en une phrase
    annonce_sous: Pour la personne qui la cherche ce soir
    site: votre-site.ma
    page_titre: La même promesse que l'annonce
    page_texte: Ce qu'il obtient, en combien de temps, et ce qu'il doit faire maintenant.
    page_bouton: Être rappelé
    form_titre: On vous rappelle
    champs:
      - { label: Prénom, valeur: Yassine }
      - { label: Votre projet, valeur: Dans les trois prochains mois }
      - { label: Quand vous rappeler ?, valeur: Demain matin }
    form_bouton: Être rappelé
    message: "Merci Yassine, votre demande est bien reçue. Quel moment vous arrange demain pour un appel de 10 minutes ?"
    creneaux: ["9 h 30", "11 h", "14 h"]
    reponse: 9 h 30, parfait
    jour: Samedi
    jours: [L, M, M, J, V, S, D]
    agenda: "Mercredi 9 h 30 : appel. Samedi 11 h : rendez-vous."
    signe: Client signé
  delai:
    - { titre: Réponse en 40 s, sous: message WhatsApp automatique }
    - { titre: "Demain, 9 h 30", sous: créneau choisi par le prospect }

preuves:
  titre: Ce chemin, nous l'avons construit pour plus de 42 entreprises.
  texte: "Une compagnie aérienne, une banque, des promoteurs immobiliers, des marques en ligne. Chaque mission commence par la même question : à qui parle-t-on vraiment ?"
  chiffre: 80000
  chiffre_affiche: "80 000"
  legende: leads générés pour nos clients depuis janvier 2022.
  logos_aria: Ils nous ont fait confiance

pertes:
  titre: Vous avez des leads. Il vous manque des clients.
  texte: "Le budget publicitaire se perd rarement dans l'annonce. Il se perd entre deux étapes, là où personne ne regarde. Si l'une de ces phrases vous ressemble, voici ce qui se passe, et ce qu'on peut y faire."
  rappel:
    phrase: Mes commerciaux rappellent des numéros qui ne répondent pas.
    texte: "La demande arrive à 22 h. Personne ne la voit avant le lendemain après-midi. Quand le commercial appelle enfin, le prospect ne décroche plus, ou il a déjà parlé à un concurrent."
    solution: "Ce que nous mettons en place avec vous : une réponse WhatsApp automatique dans la minute, qui propose un créneau, et des questions qui trient. Vos équipes rappellent le matin même, avec le contexte en main."
    dessin: { demande: Demande, heure: "22 h", appel: Appel, avant: "Lendemain, 16 h", apres: "Lendemain, 9 h 30", trou: 18 heures sans réponse, vite: Réponse en 40 secondes, bulle_titre: "WhatsApp automatique, 22 h 06", bulle: "Demain 9 h 30, ça vous va ?", messagerie: Messagerie, decroche: Décroché }
  attribution:
    phrase: Je paie des leads sans savoir lesquels signent.
    texte: "Les plateformes comptent les clics et les formulaires. Personne ne relie une vente à l'annonce qui l'a amenée, alors le budget continue de financer des annonces qui ne vendent rien."
    solution: "Ce que nous mettons en place : le suivi de chaque vente jusqu'à l'annonce qui l'a amenée. On coupe ce qui ne signe pas, on renforce ce qui signe."
    dessin: { annonces: [Annonce A, Annonce B, Annonce C], budget: Budget, signe: Signé, vente: vente, ventes: ventes, coupee: Coupée, resultat: "C ne signe rien : son budget passe sur B." }
  langage:
    phrase: Mon agence parle de clics, ma direction parle de chiffre d'affaires.
    texte: "Chacun a son tableau et personne ne fait le lien. Les réunions tournent en rond, et le budget se décide à l'instinct."
    solution: "Ce que nous mettons en place : un seul tableau, lu chaque semaine, qui va du clic jusqu'au dirham encaissé."
    dessin: { agence: L'agence, clics: 12 400 clics, direction: La direction, question: Et les ventes ?, colonnes: [Clics, Leads, RDV, Ventes, DH], valeurs: ["12 400", "310", "42", "9", "1,2 M"], exemple: Chiffres d'exemple }

