faq:
  titre: Les questions qu'on nous pose avant de commencer.
  questions:
    - q: Que fait exactement Leadvice ?
      a: "Leadvice est un cabinet de conseil en stratégie marketing et en acquisition client, basé à Casablanca. Nous clarifions votre stratégie, créons les messages et les publicités, lançons et pilotons vos campagnes Meta Ads et Google Ads, et lisons les chiffres avec vous jusqu'aux ventes."
    - q: Combien coûte un lead avec Leadvice ?
      a: "Sur l'ensemble de nos clients, le coût moyen par lead est inférieur à 10 DH sur Meta Ads et se situe entre 10 et 20 DH sur Google Ads. Il varie selon le secteur et le prix de ce que vous vendez. Le chiffre qui compte vraiment, c'est le coût par client."
    - q: Des leads à moins de 10 DH, ce sont de bons leads ?
      a: "Un lead bon marché qui ne répond pas coûte cher. Nos formulaires posent les questions qui trient (projet, délai, besoin), et nous suivons avec vous le taux de leads joignables et de rendez-vous en plus du coût par lead."
    - q: Qui rappelle les demandes ?
      a: "Vos équipes. Nous mettons en place ce qui les aide à rappeler vite et bien : une réponse automatique immédiate, souvent sur WhatsApp, un créneau proposé au prospect, et une fiche qui résume sa demande. Nous n'avons pas de centre d'appels et ne le remplaçons pas."
    - q: Que se passe-t-il pendant le diagnostic offert ?
      a: "Un échange de 45 minutes, en visio ou par téléphone. Nous regardons vos campagnes, vos chiffres et votre offre. Sous 48 heures, vous recevez votre plan d'acquisition écrit, que vous travailliez avec nous ensuite ou non."
    - q: Combien coûte un accompagnement ?
      a: "Le diagnostic et le plan sont offerts. Une mission de conseil est chiffrée à l'avance, sur un périmètre écrit. Un accompagnement acquisition est mensuel, hors budget publicitaire, que vous payez directement aux plateformes. Vous recevez un prix ferme après le diagnostic, avant tout engagement."
    - q: Les comptes publicitaires nous appartiennent-ils ?
      a: "Oui. Les comptes Meta et Google sont à votre nom, et le budget publicitaire est payé directement aux plateformes, séparément de nos honoraires."

fin:
  titre: Le prochain point sur ce chemin, c'est vous.
  texte: "45 minutes, offert. Nous regardons vos annonces, votre page et ce qui se passe après une demande. Sous 48 heures, votre plan écrit."
