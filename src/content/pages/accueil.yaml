    - { cle: crea, moment: L'annonce, titre: Création, texte: "Angles, accroches, visuels et vidéos. Le message qui arrête la bonne personne.", url: /expertises/creation/, lien: Voir la création }
    - { cle: acq, moment: Jusqu'au formulaire, titre: Acquisition, texte: "Meta Ads, Google Ads, pages et formulaires qui trient avant de compter.", url: /expertises/acquisition/, lien: Voir l'acquisition }
    - { cle: pil, moment: Après la demande, titre: Pilotage, texte: "Chaque lundi, les chiffres jusqu'aux ventes, et les décisions de la semaine.", url: /expertises/pilotage/, lien: Voir le pilotage }
  sites: "Votre page fait fuir vos visiteurs ? Nous concevons aussi des sites et des pages d'atterrissage pensés pour vos campagnes, rapides et écrits pour faire agir."
  sites_lien: Voir les sites web

systeme:
  titre: Une campagne qui vend tient sur six pièces.
  texte: "Une offre claire, la bonne audience, un message juste, les bons canaux, une page qui convertit et des chiffres lus chaque semaine. Quand une seule manque, le budget part ailleurs. Notre travail consiste à les faire tenir ensemble."
  pieces: [Offre, Audience, Message, Canaux, Conversion, Données]
  centre: [Des, clients]
  aria: "Les six pièces du système, reliées autour des clients : offre, audience, message, canaux, conversion, données"

pour_qui:
  titre: Où que vous en soyez, il y a un point de départ.
  texte: "Promoteurs et commercialisateurs immobiliers, entreprises B2B, banques et services, marques en ligne : nos clients nous appellent à des moments très différents. Voici les trois que nous voyons le plus souvent."
  departs:
    - situation: Vous lancez une offre, un programme ou un nouveau marché.
      reponse: "On commence par la stratégie : à qui vous parlez, avec quelle promesse, sur quels canaux et avec quel budget de départ. La première annonce part quand ces réponses sont écrites."
      lien: Voir la stratégie
      url: /expertises/strategie/
    - situation: Vos campagnes tournent, mais elles rapportent moins qu'elles ne coûtent.
      reponse: "On reprend le chemin entier, de l'annonce jusqu'au rappel du prospect. On répare l'étape qui casse, puis on lit les chiffres avec vous chaque semaine."
      lien: Voir l'acquisition
      url: /expertises/acquisition/
    - situation: Vous voulez d'abord vous faire connaître.
      reponse: "Une campagne de notoriété se mesure aussi : portée sur la bonne cible, souvenir de la marque, recherches de votre nom sur Google. Nous fixons ces objectifs avec vous avant le lancement, pour que les ventes suivent."
      lien: Voir la création
      url: /expertises/creation/
  conseil: "Vous préférez garder l'exécution en interne ? Nous intervenons aussi en conseil seul : audit, plan d'action, accompagnement de vos équipes."
  secteurs:
    - { url: /secteurs/immobilier/, libelle: L'immobilier }
    - { url: /secteurs/b2b/, libelle: Les grands comptes et le B2B }
    - { url: /secteurs/e-commerce/, libelle: Les marques et l'e-commerce }
  secteurs_intro: "Notre approche secteur par secteur :"

dirham:
  titre: Le chemin d'un dirham.
  aria: Le chemin d'un dirham
  etapes:
