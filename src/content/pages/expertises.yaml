seo:
  title: Expertises | Stratégie, création, acquisition, pilotage | Leadvice
  description: 'Stratégie marketing, création publicitaire, Meta Ads, Google Ads, génération de leads et pilotage de la performance : les quatre leviers d''acquisition de Leadvice.'
  og: expertises
fil: Expertises
h1: Quatre métiers, un seul chemin.
reponse: "Leadvice intervient sur quatre leviers, la stratégie, la création, l'acquisition et le pilotage, et conçoit aussi les pages qui reçoivent vos campagnes. Vous pouvez nous confier un levier ou le chemin entier. Nous les pensons toujours comme un seul système : une bonne campagne ne rattrape pas une offre floue."
acces_aria: Accès direct aux expertises
complement: Et pour accueillir vos visiteurs
formats:
  titre: Trois façons de travailler avec nous.
  cartes:
  - titre: Diagnostic et plan d'action
    texte: 'Une mission courte pour savoir où vous en êtes. Nous auditons votre offre, vos campagnes, vos contenus et vos chiffres, puis nous vous remettons un plan d''action hiérarchisé : ce qu''il faut arrêter, corriger et lancer, dans quel ordre. Vous pouvez l''exécuter avec vos équipes ou avec nous.'
  - titre: Accompagnement acquisition
    texte: Un accompagnement mensuel. Nous construisons la stratégie, produisons les créations, gérons vos campagnes Meta Ads et Google Ads et suivons les chiffres chaque semaine avec vous. C'est le format que choisissent les entreprises qui veulent un flux régulier de prospects qualifiés.
  - titre: Conseil stratégique
    texte: 'Une mission de conseil sur un sujet précis : positionnement, structuration de l''offre, lancement d''un produit ou d''un programme, organisation de l''équipe marketing. Nous travaillons avec la direction, jusqu''aux décisions.'
boucle:
  aria: La boucle des quatre leviers
  legende: La boucle
  len: 200
  etapes:
  - texte: Ces leviers ne fonctionnent pas seuls.
    de: 0
    a: 0.35
  - texte: La stratégie oriente la création. La création nourrit l'acquisition.
    de: 0.35
    a: 0.75
  - texte: L'acquisition produit des données. Les données corrigent la stratégie.
    de: 0.75
    a: 1
cloture:
  titre: Commençons par votre chemin.
  texte: 45 minutes, offert. Nous regardons vos campagnes, vos chiffres et votre offre. Sous 48 heures, vous recevez votre plan écrit, avec ce qui freine votre acquisition et par quoi commencer.

