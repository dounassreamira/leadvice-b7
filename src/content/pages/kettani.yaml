recit:
- titre: Le problème.
  texte: 'Un promoteur qui communique sur plusieurs programmes risque de tout mélanger : mêmes audiences, mêmes messages, budget réparti à l''aveugle. Le volume de contacts peut sembler bon pendant que les commerciaux rappellent des personnes qui n''ont ni le projet ni le budget. L''enjeu était d''obtenir des prospects qualifiés pour chaque programme, à un coût maîtrisé, et de savoir à tout moment lequel performait.'
- titre: L'angle.
  texte: 'Nous avons traité chaque programme comme une campagne à part entière, avec sa lecture propre, au lieu d''un dispositif unique. Nous avons construit pour chacun un entonnoir complet : faire connaître le programme, entretenir l''intérêt de ceux qui le découvraient, puis amener les plus avancés à demander une visite. Et nous avons décidé de parler à chaque public dans sa langue, au sens propre comme au figuré.'
- titre: Les résultats.
  texte: Sur douze mois, d'avril 2025 à mars 2026, le dispositif a généré environ 41 000 leads via Meta Ads sur l'ensemble des programmes. Chaque programme disposait de sa propre lecture des performances, ce qui a permis de déplacer le budget vers ce qui produisait des prospects qualifiés plutôt que de le répartir à parts égales.
execution:
  titre: L'exécution.
  points:
  - 'Un dispositif Meta Ads et Google Ads couvrant les sept programmes, structuré en trois étages : découverte, considération, conversion.'
  - Des audiences hyper-segmentées, avec une refonte complète du ciblage sur Le Clos de Bouznika.
  - Des créations déclinées par format, par programme et par langue, en arabe et en français, pour comparer ce qui convainc chaque public.
  - Des contenus dédiés aux Marocains résidant à l'étranger, au ton empathique et non commercial, pour un public qui achète à distance et a besoin de confiance avant tout.
  - 'Des audits réguliers des campagnes : repérage des anomalies de coût par lead, lecture séparée selon l''objectif de chaque campagne, recalcul des indicateurs qui faussaient la comparaison entre programmes.'
  - Un reporting mensuel et un bilan annuel, programme par programme.
appris:
  titre: Ce que nous avons appris.
  lecons:
  - titre: La langue change la performance.
    texte: 'Une même offre ne convainc pas de la même façon en arabe et en français : il faut tester les deux, et lire les résultats séparément.'
  - titre: Le ciblage fin bat le volume.
    texte: Resserrer les audiences fait parfois baisser le nombre de contacts et monter leur valeur. Dans l'immobilier haut de gamme, c'est le bon échange.
  - titre: Chaque programme mérite sa propre lecture.
    texte: Une moyenne sur sept programmes cache toujours un programme qui souffre et un autre qui mériterait plus de budget.
  - titre: Un levier absent est une opportunité.
    texte: 'L''audit a montré que SDR n''avait aucune présence sur Google Ads : des personnes cherchaient activement ce type de bien sans tomber sur le programme.'
cloture:
  titre: Vous commercialisez plusieurs programmes, produits ou offres ?
  texte: 45 minutes, offert. Nous regardons vos campagnes, vos chiffres et votre offre. Vous repartez avec ce qui freine votre acquisition et par quoi commencer.
