parcours:
  titre: Du brief au client signé.
  intro: Une campagne immobilière fictive, suivie de bout en bout. Chaque étape correspond à un de nos leviers.
  etapes:
    - { levier: Stratégie, titre: Le brief, texte: Un objectif, une cible, un message. }
    - { levier: Création, titre: "L'annonce", texte: Un visuel et une phrase qui parlent à la cible. }
    - { levier: Acquisition, titre: La diffusion, texte: Sortir du fil, devant les bonnes personnes. }
    - { levier: Sites web, titre: Le formulaire, texte: "Trois champs, le reste attendra l'appel." }
    - { levier: Pilotage, titre: Le lead, texte: Qualifié, transmis, suivi. }
    - { levier: Résultat, titre: Le client, texte: Ce que vous vouliez au départ. }
  brief:
    etiquette: Brief de campagne
    titre: Remplir les visites du samedi
    lignes:
      - { k: Cible, v: Primo-accédants, 28 à 40 ans, Casablanca et alentours }
      - { k: Message, v: Un trois pièces accessible, à visiter ce week-end }
      - { k: Indicateur, v: Visites confirmées }
  annonce:
    etiquette: Sponsorisé
    titre: Votre trois pièces, à 25 minutes du centre
    texte: Visites ce samedi. Réservez votre créneau.
    bouton: Réserver une visite
  formulaire:
    etiquette: Page de la résidence
    titre: Réservez votre visite de samedi
    champs:
      - { k: Prénom, v: Salma }
      - { k: Téléphone, v: "06 •• •• •• ••" }
      - { k: Créneau, v: "Samedi, 11 h" }
    bouton: Réserver ma visite
  lead:
    etiquette: Tableau de suivi
    titre: Nouveau lead
    statut: Qualifié
    lignes:
      - { k: Source, v: "Meta, campagne visites samedi" }
      - { k: Projet, v: "Résidence principale, trois pièces" }
      - { k: Suite, v: "Rappel par l'équipe commerciale" }
  fin:
    titre: Visite confirmée.
    texte: "Samedi, 11 h. C'est exactement ce que demandait le brief."

simulateur:
  titre: Simulez le chemin de votre budget.
  intro: "Bougez les curseurs : le schéma montre ce que deviennent vos dirhams, du budget publicitaire jusqu'aux ventes."
  onglets_aria: "Type d'activité"
  modes:
    lead:
      onglet: Vous cherchez des prospects
      etapes: [Budget investi, Publicité, Clients signés, "Chiffre d'affaires"]
      champs:
        - { id: budget, label: Budget publicitaire mensuel, min: 2000, max: 200000, pas: 1000, defaut: 10000, unite: " DH" }
        - { id: cpl, label: Coût par lead, min: 3, max: 60, pas: 1, defaut: 10, unite: " DH" }
        - { id: q, label: Leads qualifiés, min: 10, max: 95, pas: 1, defaut: 70, unite: " %" }
        - { id: c, label: Leads qualifiés qui signent, min: 1, max: 50, pas: 1, defaut: 10, unite: " %" }
        - { id: v, label: "Valeur d'un client", min: 500, max: 100000, pas: 500, defaut: 5000, unite: " DH" }
      resultats: ["leads reçus par mois", "par lead, soit environ {usd} $", nouveaux clients par mois, pour gagner un client, "de chiffre d'affaires généré", chaque dirham investi rapporte]
      phrase: "Avec ces réglages, <b>{budget} DH</b> de publicité deviennent <b>{n} clients</b> et <b>{ca} DH</b> de chiffre d'affaires, soit <b>× {x}</b>."
    ecom:
      onglet: Vous vendez en ligne
      etapes: [Budget investi, Publicité, Commandes livrées, "Chiffre d'affaires livré"]
      champs:
        - { id: budget, label: Budget publicitaire mensuel, min: 2000, max: 200000, pas: 1000, defaut: 10000, unite: " DH" }
        - { id: cpc, label: Coût par visite, min: 0.3, max: 5, pas: 0.1, defaut: 1.2, unite: " DH" }
        - { id: cr, label: Taux de conversion, min: 0.3, max: 8, pas: 0.1, defaut: 4, unite: " %" }
        - { id: dl, label: "Commandes livrées (paiement à la livraison)", min: 40, max: 100, pas: 1, defaut: 92, unite: " %" }
        - { id: pm, label: Panier moyen, min: 100, max: 3000, pas: 10, defaut: 450, unite: " DH" }
      resultats: [visites, commandes par mois, commandes livrées, par commande livrée, "de chiffre d'affaires livré", chaque dirham investi rapporte]
      phrase: "Avec ces réglages, <b>{budget} DH</b> de publicité deviennent <b>{n} commandes livrées</b> et <b>{ca} DH</b> de chiffre d'affaires, soit <b>× {x}</b>."
  cta_aide: "Diagnostic offert : nous refaisons ce calcul avec vos données réelles."
  note: "Simulation indicative, réglée par défaut sur notre coût moyen par lead constaté sur Meta Ads (moins de 1 $, soit environ 10 DH). Les taux réels dépendent de votre secteur, de votre offre et de vos campagnes : nous les estimons avec vous pendant le diagnostic."

chiffres:
  retenus: ["< 10 DH", "+1 400", "+80 000"]
  note: Le coût par lead varie selon le secteur et le prix de ce que vous vendez. Le chiffre qui compte vraiment est le coût par client.

