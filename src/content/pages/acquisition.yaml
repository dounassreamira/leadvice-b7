  - texte: "Chaque demande arrive triée : à rappeler ce matin, ou à relancer."
    de: 0.56
    a: 1.0
faisons:
  titre: Ce que nous faisons.
  intro: Chaque mission est menée par les fondatrices, de l'analyse aux décisions.
  items:
  - titre: Meta Ads (Facebook et Instagram)
    texte: 'Nous structurons vos campagnes en entonnoir : faire connaître, faire considérer, faire agir. Chaque étape a ses audiences, ses messages et son budget.'
  - titre: Google Ads
    texte: Search pour capter ceux qui cherchent déjà une solution comme la vôtre, Display pour rester présent pendant leur réflexion.
  - titre: Génération de leads
    texte: 'Des formulaires conçus pour qualifier : objectif, rôle, budget, situation actuelle. Vos équipes reçoivent moins de contacts inutiles et savent qui rappeler en premier.'
  - titre: Ciblage et segmentation
    texte: Nous construisons des audiences précises, par intérêt, par comportement et à partir de vos propres données, et nous excluons celles qui coûtent sans convertir.
  - titre: Media buying
    texte: Répartition du budget entre canaux, campagnes et audiences, ajustée chaque semaine vers ce qui produit des clients.
pour_vous:
  titre: Est-ce pour vous ?
  situations:
  - « Vos campagnes génèrent des leads, mais vos commerciaux passent leurs journées à appeler des personnes qui n'achèteront pas. »
  - « Votre coût par lead augmente et personne ne sait vraiment pourquoi. »
  - « Vous voulez lancer l'acquisition en ligne sérieusement, avec une structure qui tienne quand le budget augmente. »
comment:
  titre: Comment nous travaillons.
  texte: 'Nous commençons par la fin : ce qu''est un bon client pour vous. Nous construisons ensuite les campagnes, les formulaires et le suivi qui permettent de le trouver, puis nous lisons les chiffres chaque semaine avec vous pour déplacer le budget là où il rapporte.'
faq:
  titre: Vos questions.
  questions:
  - q: Quel budget publicitaire faut-il prévoir ?
    a:
    - Il dépend de votre marché, de votre panier moyen et du nombre de clients que vous visez. Nous le calculons avec vous en partant du nombre de clients que vous voulez. Le budget publicitaire est payé directement aux plateformes, séparément de nos honoraires.
  - q: Comment faites-vous pour obtenir des leads de qualité ?
    a:
    - 'En triant avant de compter : des audiences précises, des messages qui attirent les bonnes personnes et repoussent les autres, et des formulaires qui posent les questions utiles. Nous suivons ensuite ce que deviennent les leads, jusqu''au rendez-vous.'
  - q: Les comptes publicitaires nous appartiennent-ils ?
    a:
    - Oui. Les campagnes sont gérées dans vos comptes Meta et Google, ou dans des comptes créés à votre nom. Les données et l'historique restent chez vous.
  - q: Pouvez-vous aussi créer nos pages de destination ?
    a:
    - Oui. Une campagne qui renvoie vers une page pensée pour elle convertit mieux qu'une page d'accueil générale. Nous concevons ces pages, ou un site complet, dans notre offre <a class="tlink" href="/expertises/sites-web/">Sites web</a>.
  - q: En combien de temps arrivent les premiers leads ?
    a:
    - Souvent dans les jours qui suivent le lancement. Pour juger une campagne et l'optimiser sérieusement, il faut en revanche quelques semaines de données.
cloture:
  titre: Commençons par votre chemin.
  texte: 45 minutes, offert. Nous regardons vos campagnes, vos chiffres et votre offre. Sous 48 heures, vous recevez votre plan écrit, avec ce qui freine votre acquisition et par quoi commencer.
suivante: pilotage
service: Génération de leads, Meta Ads et Google Ads
