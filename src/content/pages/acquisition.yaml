seo:
  title: Génération de leads, Meta Ads et Google Ads au Maroc | Leadvice
  description: 'Campagnes Meta Ads et Google Ads, leads qualifiés, formulaires qui trient avant de compter : moins de 10 DH par lead en moyenne sur Meta Ads.'
  og: acquisition
fil: Acquisition
h1: Des leads que vos commerciaux ont envie de rappeler.
reponse: "Leadvice conçoit et pilote vos campagnes Meta Ads et Google Ads au Maroc, de la structure des comptes au suivi des demandes. L'objectif n'est pas le volume : c'est le nombre de prospects joignables et qualifiés qui deviennent des rendez-vous. Sur l'ensemble de nos clients, le coût moyen par lead est inférieur à 10 DH sur Meta Ads."
scene:
  nom: target
  len: 300
  aria: "De l'annonce à la fiche du lead"
  legende: "De l'annonce à la fiche du lead"
  etapes:
  - texte: "Votre annonce, devant la personne qui a un projet."
    de: 0.03
