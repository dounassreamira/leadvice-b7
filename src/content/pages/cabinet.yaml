seo:
  title: Le cabinet | Leadvice, conseil stratégique et marketing à Casablanca
  description: Leadvice est un cabinet de conseil fondé à Casablanca en 2022 par deux ingénieures. Notre méthode, notre philosophie et nos fondatrices.
  og: cabinet
fil: Le cabinet
h1: "Deux ingénieures, une seule question : qui achète vraiment ?"
reponse: Leadvice est un cabinet de conseil en stratégie marketing et en acquisition client, fondé à Casablanca en 2022. Nous aidons les entreprises à transformer leur marketing en clients, en reliant la stratégie, la création, les campagnes et les chiffres. Nous conseillons, et nous exécutons ce que nous conseillons.
manifeste:
  titre: Ce que nous changeons d'abord.
  lignes:
  - non: Dix campagnes lancées en même temps.
    oui: Trois décisions, prises dans l'ordre.
  - non: Des contenus publiés pour être présents.
    oui: Des angles testés sur les ventes.
  - non: Des leads comptés au volume.
    oui: Des prospects rappelés le matin même.
  - non: Un reporting de quarante lignes.
    oui: Une page lue ensemble chaque lundi.
difference:
  titre: Un cabinet, pas une agence.
  texte: 'Une agence exécute ce qu''on lui demande. Nous commençons par vérifier que c''est la bonne chose à demander. Chaque mission démarre par un cadrage, avec un objectif écrit en prospects et en ventes. Nous lisons les chiffres avec vous chaque semaine, nous adaptons la solution à votre situation au lieu de vendre un forfait, et nous gardons en tête l''ensemble de votre entreprise : vos équipes, vos marges, votre calendrier.'
engagement:
  titre: Ce à quoi nous nous engageons.
  points:
  - titre: Des objectifs écrits en ventes.
    texte: Au démarrage, nous fixons avec vous ce qui compte, prospects qualifiés, rendez-vous et ventes. C'est sur ces chiffres que nous sommes jugées.
  - titre: Des conseils applicables chez vous.
    texte: Chaque recommandation tient compte de votre marché, de votre budget et de vos équipes. Une idée que vous ne pouvez pas mettre en œuvre n'a rien à faire dans le plan.
  - titre: Un interlocuteur qui répond.
    texte: Vous travaillez directement avec les fondatrices, et vous savez à tout moment ce qui est fait et ce que ça rapporte.
methode:
  titre: Notre méthode.
  textes:
  - "Nous écoutons, puis nous lisons vos annonces, votre page et vos chiffres. Sous 48 heures, votre plan écrit dit où le chemin casse."
  - "Un plan court : quoi lancer d'abord, avec quel budget, pour produire quoi."
  - "Nous mettons en place annonces, pages et formulaires, avec vos équipes ou à leur place."
  - "Chaque semaine, les chiffres jusqu'aux ventes, dans un bilan court qui sert à décider."
  - "Nous déplaçons le budget vers ce qui signe, puis nous mesurons à nouveau."
fondatrices:
  titre: Derrière les données, il y a toujours une décision humaine.
  bios:
  - texte: 'Ingénieure d''État en informatique de l''École Mohammadia d''Ingénieurs, diplômée du Mastère Spécialisé de l''ESSEC en stratégie, transformation digitale et innovation, Amira a commencé dans l''informatique bancaire avant de se consacrer à l''acquisition. Elle conçoit et pilote les campagnes Meta Ads et Google Ads de Leadvice, de la structure de l''entonnoir à l''optimisation du coût d''acquisition. Sa conviction : un bon chiffre ne vaut rien s''il ne mène pas à une décision.'
    lien: Amira sur LinkedIn
  - texte: 'Ingénieure diplômée de l''École Mohammadia d''Ingénieurs, Nada a passé trois ans comme auditrice financière senior chez EY, sur des portefeuilles de clients de secteurs très variés. Elle apporte à Leadvice la rigueur de l''audit et une lecture business des sujets marketing : elle mène les diagnostics, les missions de stratégie et le cadrage des accompagnements. Sa conviction : on ne corrige bien que ce qu''on a vraiment compris.'
    lien: Nada sur LinkedIn
faq:
  titre: Questions fréquentes.
  questions:
  - q: Qu'est-ce qui distingue un cabinet de conseil d'une agence marketing ?
    a: 'Une agence exécute un brief. Un cabinet commence par vérifier que le brief est le bon : à qui vous vendez, avec quel message, sur quels canaux, et comment on saura si ça marche. Chez Leadvice, nous faisons les deux, le conseil et l''exécution, avec un seul objectif : des clients.'
  - q: Par quoi commence un accompagnement Leadvice ?
    a: 'Par un diagnostic : un échange de 45 minutes, offert, pendant lequel nous regardons vos campagnes, vos chiffres et votre offre. Si nous pouvons vous aider, nous vous faisons ensuite une proposition adaptée à votre situation.'
  - q: Combien de temps faut-il pour voir des résultats en acquisition ?
    a: Les premiers leads arrivent souvent dans les jours qui suivent le lancement d'une campagne. Pour juger la qualité des prospects et optimiser sérieusement, comptez quelques semaines de données. Les effets d'un travail de stratégie, eux, se mesurent sur plusieurs mois.
  - q: Gérez-vous les campagnes vous-mêmes ou conseillez-vous seulement ?
    a: Les deux. Nous pouvons concevoir, lancer et piloter vos campagnes Meta Ads et Google Ads, ou accompagner vos équipes qui les gèrent en interne.
  - q: Travaillez-vous avec nos équipes internes ?
    a: Oui, c'est même ce que nous préférons. Nous travaillons avec votre direction, votre équipe marketing et vos commerciaux, pour que les chiffres des campagnes rencontrent ceux des ventes.
  - q: Sur quels canaux intervenez-vous ?
    a: Principalement Meta Ads (Facebook, Instagram) et Google Ads (Search, Display), ainsi que les contenus pour les réseaux sociaux. Le choix des canaux dépend toujours de votre audience et de votre objectif.
  - q: Comment mesurez-vous la performance ?
    a: 'Avec les indicateurs qui mènent à vos ventes : coût par lead, part de leads qualifiés, coût par opportunité, coût d''acquisition client. Nous les suivons chaque semaine et nous les définissons avec vous au démarrage.'
  - q: Intervenez-vous en dehors de Casablanca ?
    a: Oui, partout au Maroc, et à distance pour les entreprises qui ciblent le Maroc ou les Marocains résidant à l'étranger.
cloture:
  titre: Parlons de votre croissance.
  texte: 45 minutes, offert. Nous regardons vos campagnes, vos chiffres et votre offre. Sous 48 heures, vous recevez votre plan écrit, avec ce qui freine votre acquisition et par quoi commencer.
